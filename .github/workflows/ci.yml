name: ci

# The wake guard's tests are pure and offline (the tier that would call
# whisper is skipped when no server answers), so this needs nothing but
# python and pytest. Docs-only pushes do not trigger a run and a superseded
# run is cancelled rather than finishing.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '.gitignore', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - run: pytest -q
